# Tuned for the BiGGr production VM (D8s_v5: 8 vCPU, ~32 GB RAM, SSD /data).
# The database is ~12 GB, so shared_buffers is large enough to hold it
# entirely in PostgreSQL's own cache (cache hit ~99% once warmed).

listen_addresses = '*'

# Memory
shared_buffers = 12GB              # PG's own buffer pool. Large enough to hold
                                   # the full ~12 GB DB in memory.
effective_cache_size = 24GB        # Planner hint: total RAM available for
                                   # caching (PG + OS). ~75% of 32 GB.
work_mem = 32MB                    # Per sort/hash node. Conservative so 100
                                   # connections doing joins won't exhaust RAM.
maintenance_work_mem = 512MB       # For VACUUM / CREATE INDEX.

# Planner — /data is SSD, so random reads are cheap.
random_page_cost = 1.1             # Default 4.0 assumes spinning disk and
                                   # discourages index scans.
effective_io_concurrency = 200     # SSD can serve many concurrent reads.

# Connections
max_connections = 100              # 6 web workers + headroom.

# Write/checkpoint behaviour (read-mostly workload; gentle checkpoints)
checkpoint_completion_target = 0.9
wal_buffers = 16MB
