upstream biggr {
        server biggr-web:8910;
}


# ---------------------------------------------------------------------------
# Abuse protection
#
# Zones are keyed on the client IP.  10m of shared memory holds ~160k IPs.
#   web    - HTML pages (search, model/reaction/metabolite pages) are the
#            expensive ones: they hit Postgres on every request.
#   api    - JSON API; scripts (cobrapy etc.) are legitimate here, so allow
#            a higher sustained rate but a smaller burst.
#   static - css/js/model downloads; cheap for Tornado, but a scraper pulling
#            every model file still saturates disk/network.
# Requests over the limit get 429 rather than the default 503 so they are
# distinguishable from a genuinely overloaded upstream in the logs.
# ---------------------------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=web:10m    rate=5r/s;
limit_req_zone  $binary_remote_addr zone=api:10m    rate=10r/s;
limit_req_zone  $binary_remote_addr zone=static:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level  warn;
limit_conn_log_level warn;

# Known high-volume crawlers that ignore robots.txt, plus requests with no
# User-Agent at all.  Real browsers and the usual python/R HTTP clients pass.
map $http_user_agent $blocked_ua {
        default 0;
        ""      1;
        ~*(Bytespider|PetalBot|Amazonbot|GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|anthropic-ai|CCBot|Google-Extended|Applebot-Extended|meta-externalagent|FacebookBot|Diffbot|ImagesiftBot|Omgili|SemrushBot|AhrefsBot|MJ12bot|DotBot|BLEXBot|DataForSeoBot|serpstatbot|Scrapy|python-requests/0|Go-http-client|zgrab|masscan) 1;
}


server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name bigg.bio www.bigg.bio biggr.org www.biggr.org;
        server_tokens off;

        location /.well-known/acme-challenge/ {
                root /var/www/certbot;
        }

        location / {
                return 301 https://$host$request_uri;
        }
}


server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name www.bigg.bio biggr.org www.biggr.org;
        server_tokens off;

        ssl_certificate /etc/nginx/ssl/live/biggr.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/biggr.org/privkey.pem;

        return 301 https://bigg.bio$request_uri;
}


server {
        listen 443 default_server ssl http2;
        listen [::]:443 ssl http2;

        server_name bigg.bio;
        server_tokens off;

        ssl_certificate /etc/nginx/ssl/live/biggr.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/biggr.org/privkey.pem;

        # Don't let one client hold Tornado's worker hostage with slow
        # requests or hundreds of parallel connections.
        limit_conn perip 20;
        client_body_timeout 10s;
        client_header_timeout 10s;
        send_timeout 30s;

        if ($blocked_ua) {
                return 403;
        }

        # Polite crawlers honour this.  Search and the API are expensive and
        # of no use to a search index, so keep crawlers on the browseable
        # entity pages and slow them down.
        location = /robots.txt {
                add_header Content-Type text/plain;
                return 200 "User-agent: *\nCrawl-delay: 10\nDisallow: /search/\nDisallow: /api/\nDisallow: /interop-query/\nDisallow: /static/models/\n";
        }

        # Health check for monitoring - never rate limited.
        location = /health {
                access_log off;
                proxy_pass http://biggr;
                proxy_set_header Host $host;
        }

        location /api/ {
                limit_req zone=api burst=20 nodelay;
                proxy_pass http://biggr;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
                limit_req zone=static burst=60 nodelay;
                expires 1d;
                add_header Cache-Control "public";
                proxy_pass http://biggr;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
                # burst covers a real user opening a page: the HTML plus the
                # handful of XHR calls the page makes on load.
                limit_req zone=web burst=20 nodelay;
                proxy_pass http://biggr;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
}
