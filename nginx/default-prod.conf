upstream biggr {
        server biggr-web:8910;
}


server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name bigg.bio www.bigg.bio biggr.org www.biggr.org;
        server_tokens off;

        location /.well-known/acme-challenge/ {
                root /var/www/certbot;
        }

        location / {
                return 301 https://$host$request_uri;
        }
}


server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name www.bigg.bio biggr.org www.biggr.org;
        server_tokens off;

        ssl_certificate /etc/nginx/ssl/live/biggr.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/biggr.org/privkey.pem;

        return 301 https://bigg.bio$request_uri;
}


server {
        listen 443 default_server ssl http2;
        listen [::]:443 ssl http2;

        server_name bigg.bio;
        server_tokens off;

        ssl_certificate /etc/nginx/ssl/live/biggr.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/biggr.org/privkey.pem;

        location / {
                proxy_pass http://biggr;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
}
